<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4c664d">
  <title>Agro App | As tuas plantas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/garden-common.css">
  <link rel="stylesheet" href="../assets/css/plants.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../assets/images/icons/icon-192x192.png">
  <script defer src="../assets/js/pwa.js?v=31"></script>
</head>
<body class="garden-body plants-body">
  <header class="garden-header">
    <a class="garden-brand" href="dashboard.html" aria-label="Agro App, o teu jardim">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v7m0 0c-1.6-2.7-4.3-4-7-4 0 3.7 2.3 6 7 6m0-2c1.6-2.7 4.3-4 7-4 0 3.7-2.3 6-7 6m-5 0h10l-1 8H8l-1-8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>As tuas plantas</span>
    </a>
    <button class="garden-icon-button" id="notificationsButton" type="button" aria-label="Ver notificações" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="notification-dot" aria-hidden="true"></span>
    </button>
  </header>

  <main class="plants-main">
    <section class="plants-tools" aria-label="Pesquisar e filtrar plantas">
      <label class="plant-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="plantSearch" type="search" placeholder="Procurar no teu jardim..." autocomplete="off" aria-label="Procurar plantas no teu jardim">
      </label>
      <div class="plant-filters" role="group" aria-label="Filtrar por categoria">
        <button class="plant-filter is-active" type="button" data-category="all" aria-pressed="true">Todas</button>
        <button class="plant-filter" type="button" data-category="interior" aria-pressed="false">Interior</button>
        <button class="plant-filter" type="button" data-category="exterior" aria-pressed="false">Exterior</button>
        <button class="plant-filter" type="button" data-category="suculenta" aria-pressed="false">Suculentas</button>
      </div>
    </section>

    <section class="plant-list" id="plantList" aria-label="Lista de plantas" aria-live="polite"></section>
    <p class="plants-empty" id="plantsEmpty" hidden>Não encontrámos plantas com estes critérios.</p>
  </main>

  <a class="plants-add-fab" href="add-plant.html" aria-label="Adicionar planta">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-7-7h14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
  </a>

  <nav class="garden-nav" aria-label="Navegação principal">
    <a class="garden-nav-item" href="dashboard.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8m-4-3v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Jardim</span>
    </a>
    <a class="garden-nav-item is-active" href="plants.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4c-8 0-13 4-13 10a6 6 0 0 0 6 6c6 0 8-8 7-16ZM6 20c2-4 5-7 9-10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Plantas</span>
    </a>
    <a class="garden-nav-item add-plant-nav" href="add-plant.html" aria-label="Adicionar planta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v10m-5-5h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Adicionar</span>
    </a>
    <a class="garden-nav-item" href="calendar.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m3 0h2m-7 4h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Calendário</span>
    </a>
    <a class="garden-nav-item" href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21a8 8 0 0 1 16 0m-16 0h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Perfil</span>
    </a>
  </nav>

  <div class="garden-toast" id="gardenToast" role="status" aria-live="polite"></div>

  <dialog class="garden-dialog" id="plantDetailDialog" aria-labelledby="plantDetailTitle">
    <div class="garden-dialog-card article-dialog">
      <button class="dialog-close" type="button" data-close-dialog aria-label="Fechar">×</button>
      <img class="plant-detail-image" id="plantDetailImage" alt="">
      <p class="garden-eyebrow" id="plantDetailStatus"></p>
      <h2 id="plantDetailTitle"></h2>
      <p id="plantDetailSpecies"></p>
      <p id="plantDetailLocation"></p>
      <button class="create-btn" type="button" data-close-dialog>Fechar</button>
    </div>
  </dialog>

  <script src="../assets/js/plants.js"></script>
</body>
</html>
