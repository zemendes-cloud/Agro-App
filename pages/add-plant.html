<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf9f5">
  <title>Agro App | Adicionar planta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/garden-common.css">
  <link rel="stylesheet" href="../assets/css/add-plant.css">
</head>
<body class="garden-body add-plant-body">
  <header class="garden-header add-plant-header">
    <a class="add-plant-back" href="dashboard.html" aria-label="Voltar ao teu jardim">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <h1>Adicionar Planta</h1>
    <button class="garden-icon-button" id="notificationsButton" type="button" aria-label="Ver notificações" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="notification-dot" aria-hidden="true"></span>
    </button>
  </header>

  <main class="add-plant-main">
    <form id="addPlantForm" class="add-plant-form">
      <label class="plant-photo-picker" for="plantPhoto">
        <input id="plantPhoto" name="photo" type="file" accept="image/*">
        <img id="plantPhotoPreview" alt="" hidden>
        <span class="plant-photo-prompt">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 10h6l2-3h8l2 3h6v16H4V10Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M26 3v6m-3-3h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Toque para adicionar foto</span>
        </span>
      </label>

      <label class="add-plant-field">
        <span>Nome da planta</span>
        <input id="plantName" name="name" type="text" maxlength="60" placeholder="Ex.: Filomena" autocomplete="off" required>
      </label>

      <label class="add-plant-field">
        <span>Espécie</span>
        <input id="plantSpecies" name="species" type="text" maxlength="80" placeholder="Ex.: Monstera Deliciosa" autocomplete="off">
      </label>

      <label class="add-plant-field">
        <span>Localização</span>
        <select id="plantLocation" name="location" required>
          <option value="Sala de Estar">Sala de Estar</option>
          <option value="Quarto">Quarto</option>
          <option value="Cozinha">Cozinha</option>
          <option value="Escritório">Escritório</option>
          <option value="Varanda">Varanda</option>
          <option value="Jardim">Jardim</option>
          <option value="Outra">Outra localização…</option>
        </select>
      </label>
      <label class="add-plant-field custom-location-field" id="customLocationField" hidden>
        <span>Indica a localização</span>
        <input id="customLocation" name="customLocation" type="text" maxlength="60" placeholder="Ex.: Estufa">
      </label>

      <label class="add-plant-field">
        <span>Frequência de rega</span>
        <select id="wateringFrequency" name="wateringFrequency" required>
          <option value="daily">Todos os dias</option>
          <option value="twice-weekly">2x por semana</option>
          <option value="weekly" selected>1x por semana</option>
          <option value="biweekly">A cada 15 dias</option>
          <option value="monthly">1x por mês</option>
        </select>
      </label>

      <fieldset class="plant-care-options">
        <legend>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v5m0-8h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Cuidados Adicionais
        </legend>
        <div class="care-chips">
          <button class="care-chip is-selected" type="button" data-care="Muita luz" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Muita luz
          </button>
          <button class="care-chip" type="button" data-care="18-24°C" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a3 3 0 0 0-6 0v9.8a5 5 0 1 0 6 0ZM11 12v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            18-24°C
          </button>
          <button class="care-chip" type="button" data-care="Fertilizante" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4c-8 0-13 4-13 10a6 6 0 0 0 6 6c6 0 8-8 7-16ZM7 20c2-4 5-7 9-10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Fertilizante
          </button>
        </div>
      </fieldset>

      <p class="add-plant-error" id="addPlantError" role="alert" aria-live="polite" hidden></p>
      <button class="add-plant-save" type="submit">
        Guardar
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.5 2.5L16 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </main>

  <nav class="garden-nav" aria-label="Navegação principal">
    <a class="garden-nav-item" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8m-4-3v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Jardim</span></a>
    <a class="garden-nav-item" href="plants.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4c-8 0-13 4-13 10a6 6 0 0 0 6 6c6 0 8-8 7-16ZM6 20c2-4 5-7 9-10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Plantas</span></a>
    <a class="garden-nav-item add-plant-nav is-active" href="add-plant.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v10m-5-5h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Adicionar</span></a>
    <a class="garden-nav-item" href="calendar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m3 0h2m-7 4h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Calendário</span></a>
    <a class="garden-nav-item" href="profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21a8 8 0 0 1 16 0m-16 0h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Perfil</span></a>
  </nav>

  <script src="../assets/js/add-plant.js"></script>
</body>
</html>
