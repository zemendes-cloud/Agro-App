<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf9f5">
  <title>Agro App | Calendário de Cuidados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/garden-common.css">
  <link rel="stylesheet" href="../assets/css/calendar.css">
</head>
<body class="garden-body calendar-body">
  <header class="garden-header">
    <a class="garden-brand" href="dashboard.html" aria-label="Agro App, o teu jardim">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v7m0 0c-1.6-2.7-4.3-4-7-4 0 3.7 2.3 6 7 6m0-2c1.6-2.7 4.3-4 7-4 0 3.7-2.3 6-7 6m-5 0h10l-1 8H8l-1-8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>O teu jardim</span>
    </a>
    <button class="garden-icon-button" id="notificationsButton" type="button" aria-label="Ver notificações" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="notification-dot" aria-hidden="true"></span>
    </button>
  </header>

  <main class="calendar-main">
    <section class="calendar-intro">
      <h1>Calendário de<br class="calendar-title-break"> Cuidados</h1>
      <p>Acompanha o crescimento e manutenção do teu refúgio verde.</p>
    </section>

    <section class="calendar-card" aria-label="Calendário mensal de cuidados">
      <div class="calendar-month-bar">
        <h2 id="calendarMonth" aria-live="polite"></h2>
        <div class="calendar-month-controls">
          <button id="previousMonth" type="button" aria-label="Mês anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="nextMonth" type="button" aria-label="Mês seguinte"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="calendar-grid calendar-weekdays" aria-hidden="true">
        <span>DOM</span><span>SEG</span><span>TER</span><span>QUA</span><span>QUI</span><span>SEX</span><span>SÁB</span>
      </div>
      <div class="calendar-grid calendar-days" id="calendarDays" role="group" aria-label="Dias do mês"></div>
      <div class="calendar-legend" aria-label="Legenda de tarefas">
        <span><i class="legend-water"></i> Rega</span>
        <span><i class="legend-care"></i> Outros cuidados</span>
      </div>
    </section>

    <section class="today-tasks" aria-labelledby="tasksHeading">
      <div class="tasks-heading-row">
        <h2 id="tasksHeading">Tarefas de Hoje</h2>
        <span class="pending-count" id="pendingCount">0 PENDENTES</span>
      </div>
      <div class="task-list" id="taskList" aria-live="polite"></div>
      <p class="no-tasks" id="noTasks" hidden>Não tens cuidados agendados para este dia.</p>
    </section>
  </main>

  <div class="garden-toast" id="gardenToast" role="status" aria-live="polite"></div>

  <nav class="garden-nav" aria-label="Navegação principal">
    <a class="garden-nav-item" href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8m-4-3v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Jardim</span></a>
    <a class="garden-nav-item" href="plants.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4c-8 0-13 4-13 10a6 6 0 0 0 6 6c6 0 8-8 7-16ZM6 20c2-4 5-7 9-10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Plantas</span></a>
    <a class="garden-nav-item add-plant-nav" href="add-plant.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v10m-5-5h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Adicionar</span></a>
    <a class="garden-nav-item is-active" href="calendar.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m3 0h2m-7 4h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Calendário</span></a>
    <a class="garden-nav-item" href="profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21a8 8 0 0 1 16 0m-16 0h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Perfil</span></a>
  </nav>

  <script src="../assets/js/calendar.js"></script>
</body>
</html>
