<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4c664d">
  <title>Agro App | Registo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../assets/images/icons/icon-192x192.png">
  <script defer src="../assets/js/pwa.js"></script>
</head>
<body>
  <main class="login-screen">
    <section class="login-card" aria-labelledby="registerHeading">
      <div class="login-brand">
        <div class="brand-badge" aria-hidden="true">🌿</div>
        <h1 id="registerHeading">Criar conta</h1>
        <p>Regista-te para começar a usar a Agro App.</p>
      </div>

      <p id="authMessage" class="auth-message" role="alert" aria-live="polite" hidden></p>
      <form class="login-form" id="registerForm">
        <label>
          <span>Nome</span>
          <div class="input-box">
            <input id="registerName" type="text" maxlength="80" placeholder="Nome completo" autocomplete="name" required />
          </div>
        </label>

        <label>
          <span>E-mail</span>
          <div class="input-box">
            <input id="registerEmail" type="email" maxlength="254" placeholder="nome@exemplo.com" autocomplete="email" required />
          </div>
        </label>

        <label>
          <span>Palavra-passe (mínimo 8 caracteres)</span>
          <div class="input-box password-box">
            <input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="eye-button" aria-label="Mostrar palavra-passe">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10 2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </label>

        <label>
          <span>Confirmar palavra-passe</span>
          <div class="input-box password-box">
            <input id="registerPasswordConfirm" type="password" minlength="8" autocomplete="new-password" required />
            <button type="button" class="eye-button" aria-label="Mostrar palavra-passe">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Zm10 2.5A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </label>

        <button type="submit" class="create-btn login-btn">Criar conta</button>
        <a href="login.html" class="back-link">Já tens conta? Iniciar sessão</a>
      </form>
    </section>
  </main>
  <script defer src="../assets/js/local-auth.js"></script>
  <script defer src="../assets/js/auth-page.js"></script>
</body>
</html>
