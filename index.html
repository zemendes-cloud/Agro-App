<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4c664d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agro App">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Agro App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/icons/icon-192x192.png">
  <script defer src="assets/js/pwa.js?v=31"></script>
</head>
<body>

  <div class="welcome-world">
    <div class="welcome-card">
      <div class="welcome-icon" aria-label="Agro App logo">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <path d="M54 18c-7 0-13 3-18 9 3-1 7-2 10-1 9 2 15 9 16 19-1-3-3-5-6-7-5-3-10-4-15-4-7 0-12 3-16 8-4 6-5 15-1 21 5 8 15 13 26 12 13-2 23-13 25-27 2-15-7-27-21-30zm-16 22c-4-1-9 1-12 5-3 4-3 8-2 12 0 0 5-2 8-7 2-4 5-8 6-10z" fill="currentColor"/>
          <path d="M41 17c-2 7-11 11-18 12 9 2 15 8 18 16 4-9 11-15 22-18-7-3-14-6-22-10z" fill="rgba(255,255,255,0.35)"/>
        </svg>
      </div>

      <h1 class="welcome-title">Agro App</h1>
      <p class="welcome-subtitle">Bem vindo à Agro APP</p>

      <div class="welcome-plant" aria-label="imagem de uma planta"></div>

      <div class="welcome-actions">
        <a href="pages/menu.html" class="welcome-btn">Começar</a>
        <button type="button" class="choice-btn install-app-btn install-app-menu-btn" id="installAppButton">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Instalar App
        </button>
      </div>

      <p class="welcome-footer">Cultive o seu futuro com inteligência botânica.</p>
    </div>
  </div>
  <dialog class="install-dialog" id="installDialog" aria-labelledby="installDialogTitle">
    <div class="install-dialog-card">
      <img class="install-dialog-icon" src="assets/images/icons/icon.svg" alt="">
      <h2 id="installDialogTitle">Adicionar ao ecrã inicial?</h2>
      <p id="installDialogMessage">Queres instalar a Agro App e adicioná-la ao ecrã inicial do teu telemóvel?</p>
      <div class="install-dialog-actions">
        <button type="button" class="install-dialog-cancel" id="cancelInstallButton">Agora não</button>
        <button type="button" class="install-dialog-confirm" id="confirmInstallButton">Sim, instalar</button>
      </div>
    </div>
  </dialog>
  <script src="assets/js/home-redirect.js"></script>
</body>
</html>
